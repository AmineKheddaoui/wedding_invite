version: '3.8'

services:
  faire-part-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: faire-part-numerique
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persistance de la base de données SQLite
      - ./data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=/app/server/data/rsvp.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/event"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Volume nommé optionnel pour la persistance
volumes:
  faire-part-data:
    driver: local
